catch_controller:
  ros__parameters:
    sensor_mode: d435_only
    intercept_plane_z_m: 0.1075
    ball_radius_m: 0.1075

    # base_link: x forward, y left, z up.
    # D435 optical: x right, y down, z forward. The optical axis is pitched
    # upward by 15 degrees with no nominal roll/yaw offset.
    d435_camera_quaternion: [-0.43045933, 0.43045933, -0.56098553, 0.56098553]

    # Measure the optical-center position in base_link before enabling motion.
    d435_camera_translation: [0.0, 0.0, 0.0]
    d435_extrinsics_calibrated: false
    require_calibrated_extrinsics: true

    # Measure the catcher/contact point relative to base_link as well.
    catcher_point_base: [0.0, 0.0, 0.0]
